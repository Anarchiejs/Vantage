name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test repositories
        run: go run ./scripts/fixtures/make-repos.go
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: sqlc generate
        if: runner.os == 'Linux'
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate && git diff --exit-code internal/sql/gen

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build

  e2e:
    name: E2E
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Test repositories
        run: go run ./scripts/fixtures/make-repos.go
      - name: Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm --prefix web run e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  scripts:
    name: Scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
          .\observatoire.exe migrate -db (Join-Path $env:RUNNER_TEMP 'observatoire-ci.db')
      - name: Install and build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./install.sh
          ./build.sh
          ./observatoire migrate -db "${RUNNER_TEMP}/observatoire-ci.db"
      - name: Web unit tests (macOS)
        if: runner.os == 'macOS'
        run: npm --prefix web test
      - name: Start script
        if: runner.os != 'Windows'
        run: bash scripts/smoke-start.sh
