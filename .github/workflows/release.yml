name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a matching changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          grep -q "^## ${ver}$" CHANGELOG.md

  test:
    name: Test
    needs: changelog
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" name="$3"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -tags embed -ldflags "-X main.version=${TAG}" -o "dist/${name}" ./cmd/vantage
          }
          build linux amd64 vantage-linux-amd64
          build linux arm64 vantage-linux-arm64
          build darwin amd64 vantage-darwin-amd64
          build darwin arm64 vantage-darwin-arm64
          build windows amd64 vantage-windows-amd64.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
